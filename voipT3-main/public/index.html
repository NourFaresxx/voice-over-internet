<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoIP App - DMET 1042</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>VoIP App</h1>

    <!-- =====================================================
         LOGIN SECTION
    ===================================================== -->
    <div id="login-section">
        <h2>Enter Your Name</h2>
        <input type="text" id="username-input" placeholder="Your name..." />
        <button onclick="joinServer()">Join</button>
    </div>

    <!-- =====================================================
         MAIN APP
    ===================================================== -->
    <div id="app-section">

        <!-- STATUS -->
        <div id="status">Connecting...</div>

        <!-- 🧠 CALL INFO (FIX #1) -->
        <div id="call-info" style="margin:10px; color:#e94560; font-weight:bold;"></div>

        <!-- =====================================================
             VIDEO AREA
        ===================================================== -->
        <div class="video-container">

            <!-- LOCAL -->
            <div class="video-box">
                
                <video id="local-video" autoplay muted playsinline></video>
            </div>

            <!-- REMOTE VIDEOS WILL BE ADDED HERE DYNAMICALLY -->
        </div>

        <!-- =====================================================
             CALL CONTROLS (FIX #2)
        ===================================================== -->
         <div id="call-controls" style="display:none;">
         <button onclick="toggleMute()">Mute</button>
         <button onclick="toggleCamera()">Camera</button>
         <button onclick="hangUp()">Hang Up</button>
         </div>

        <!-- =====================================================
             USERS LIST
        ===================================================== -->
        <div id="users-section">
            <h3>Online Users</h3>
            <ul id="user-list">
                
            </ul>
        </div>

    </div>

    <!-- =====================================================
         INCOMING CALL POPUP
    ===================================================== -->
    <div id="incoming-call">
        <p id="caller-name">Someone is calling...</p>
        <button id="btn-accept" onclick="acceptCall()">Accept</button>
        <button id="btn-reject" onclick="rejectCall()">Reject</button>
    </div>

    <script src="client.js"></script>

</body>
</html>
